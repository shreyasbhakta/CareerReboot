<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tailor resume</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Tailor resume</h1>
  <label for="jd">Job description <span id="source" class="hint"></span></label>
  <textarea id="jd" rows="12" spellcheck="false" placeholder="Open a job posting, or paste the description here."></textarea>
  <div class="row">
    <div>
      <label for="company">Company</label>
      <input id="company" type="text" maxlength="120" placeholder="From the page">
    </div>
    <div>
      <label for="variant">Base variant</label>
      <select id="variant"></select>
    </div>
  </div>
  <button id="generate" type="button">Generate</button>
  <p id="status" role="status" aria-live="polite"></p>
  <p class="hint"><a href="options.html" target="_blank">Backend URL</a></p>
  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
