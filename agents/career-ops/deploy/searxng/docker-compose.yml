services:
  searxng:
    image: searxng/searxng:latest
    container_name: career-ops-searxng
    ports:
      # Bound to localhost only — this instance is for career-ops's own
      # local scripts, not a public search engine.
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng-data:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
    restart: unless-stopped
