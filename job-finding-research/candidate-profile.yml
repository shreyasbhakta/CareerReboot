    - autonomous agent
    - agent memory
    - agent runtime
    - ai automation
    - foundation model

# Weights must sum to 100 — see job-finding-research/SKILL.md section "Fit
# Scoring" for the full-strength (LLM-assisted) version of this rubric. This
# is the cheap, deterministic pre-filter that runs before any LLM is involved.
weights:
  technical: 30
  production: 20
  fde_domain: 20
  seniority: 15
  location: 10
  freshness: 5

tiers:
  apply_today_min: 88
  recruiter_outreach_min: 80
  watch_min: 70
  stretch_min: 60
  # below stretch_min = SKIP
